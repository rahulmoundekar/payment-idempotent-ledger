<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Payment processing architecture</title><desc id="d">Idempotent payment flow through locking, serializable transaction and balanced double-entry ledger.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="url(#g)"/><text x="55" y="55" fill="#f8fafc" font-size="25" font-family="Arial" font-weight="700">Payment Correctness Pipeline</text><text x="55" y="82" fill="#94a3b8" font-size="14" font-family="Arial">Retries become safe. Concurrent balance changes become deterministic.</text>
<g font-family="Arial" font-size="15" text-anchor="middle">
<g fill="#0f172a" stroke="#38bdf8" stroke-width="2"><rect x="45" y="145" width="175" height="95" rx="16"/><rect x="270" y="145" width="175" height="95" rx="16"/><rect x="495" y="145" width="175" height="95" rx="16"/><rect x="720" y="145" width="175" height="95" rx="16"/><rect x="945" y="145" width="210" height="95" rx="16"/></g>
<text x="132" y="183" fill="#38bdf8" font-weight="700">Idempotency</text><text x="132" y="207" fill="#cbd5e1">same key → same result</text>
<text x="357" y="183" fill="#38bdf8" font-weight="700">Deterministic Locks</text><text x="357" y="207" fill="#cbd5e1">ordered account locking</text>
<text x="582" y="183" fill="#38bdf8" font-weight="700">SERIALIZABLE Tx</text><text x="582" y="207" fill="#cbd5e1">atomic balance updates</text>
<text x="807" y="183" fill="#38bdf8" font-weight="700">Double Entry</text><text x="807" y="207" fill="#cbd5e1">DEBIT + CREDIT</text>
<text x="1050" y="183" fill="#38bdf8" font-weight="700">Invariant</text><text x="1050" y="207" fill="#cbd5e1">DEBIT = CREDIT</text></g>
<g stroke="#64748b" stroke-width="3"><path d="M220 193h50"/><path d="M445 193h50"/><path d="M670 193h50"/><path d="M895 193h50"/></g>
<text x="600" y="300" text-anchor="middle" fill="#22c55e" font-size="18" font-family="Arial" font-weight="700">Failure rule</text><text x="600" y="328" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="Arial">Any detected inconsistency causes the transaction to roll back.</text>
